[pytest]
# pytest 설정 파일

# pytest-asyncio 설정
asyncio_default_fixture_loop_scope = function

# 테스트 검색 패턴
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# 테스트 실행 시 기본 옵션
addopts =
    # 커버리지 측정
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    # 커버리지 80% 미만 시 실패
    --cov-fail-under=80
    # 상세 출력
    -v
    # 경고 표시
    -W ignore::DeprecationWarning
    # 빠른 실패 (첫 번째 실패 시 중단하려면 -x 추가)
    # -x
    # 병렬 실행 (CPU 코어 수만큼)
    # -n auto

# 테스트 경로
testpaths = tests

# 마커 정의 (테스트 그룹화)
markers =
    slow: 느린 테스트 (데이터베이스 작업 등)
    integration: 통합 테스트
    unit: 단위 테스트
    auth: 인증 관련 테스트
    users: 사용자 관련 테스트

# 커버리지 제외 경로
[coverage:run]
omit =
    */tests/*
    */conftest.py
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
# 커버리지 리포트에서 제외할 줄
exclude_lines =
    # 표준 pragma
    pragma: no cover
    # 타입 체크 전용 코드
    if TYPE_CHECKING:
    # 추상 메서드
    @abstractmethod
    # 실행 불가능한 코드
    if __name__ == .__main__.:
    # 방어적 코드
    raise AssertionError
    raise NotImplementedError
    # 디버그 전용 코드
    def __repr__
    def __str__
