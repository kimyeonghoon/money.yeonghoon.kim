# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Docker Compose - 개발 환경
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# 이 파일은 로컬 개발을 위한 Docker Compose 설정입니다.
# 코드 변경 시 자동 리로드, 디버깅 포트, 볼륨 마운트 등이 활성화됩니다.
#
# 📦 서비스 구성:
#   - mysql: MySQL 8.0 데이터베이스
#   - backend: FastAPI 백엔드 (Hot Reload + 디버거)
#   - frontend: React Native Metro 서버
#
# 🚀 전체 시작 (권장):
#   bash scripts/dev-start.sh [Android_IP]
#
# 🚀 수동 시작:
#   docker-compose -f docker-compose.dev.yml up -d
#
# 📱 개별 서비스 시작:
#   docker-compose -f docker-compose.dev.yml up -d backend
#   docker-compose -f docker-compose.dev.yml up -d frontend
#
# 📊 상태 확인:
#   docker-compose -f docker-compose.dev.yml ps
#   docker-compose -f docker-compose.dev.yml logs -f backend
#   docker-compose -f docker-compose.dev.yml logs -f frontend
#
# 🔌 서비스 접근:
#   - Backend API: http://localhost:8000
#   - API 문서: http://localhost:8000/docs
#   - Metro 서버: http://localhost:8081
#   - Python 디버거: localhost:5678
#
# 🐛 디버깅:
#   VS Code에서 "Python: Remote Attach" 디버그 구성 사용
#   포트 5678로 연결하여 백엔드 디버깅 가능
#
# 📱 WiFi 디버깅 (Node.js 로컬 설치 불필요):
#   1. Android 기기 WiFi 디버깅 활성화
#   2. adb 연결:
#      docker-compose -f docker-compose.dev.yml exec frontend adb connect 192.168.0.100:5555
#   3. 앱 빌드 및 설치:
#      docker-compose -f docker-compose.dev.yml exec frontend npm run android
#
# 💡 편의 스크립트:
#   bash scripts/adb-connect.sh 192.168.0.100
#   bash scripts/adb-troubleshoot.sh
#
# 🔄 Hot Reload:
#   - Backend: 코드 변경 시 uvicorn --reload로 자동 재시작
#   - Frontend: Metro 서버가 변경 감지하여 자동 리로드
#   - 볼륨 마운트로 로컬 파일과 컨테이너 동기화
#
# 💾 볼륨 마운트:
#   - Backend: ./backend/app → /app/app (소스 코드)
#   - Frontend: ./frontend/MobileApp → /app (React Native 프로젝트)
#   - MySQL: ./backend/mysql/my.cnf → /etc/mysql/conf.d/my.cnf (설정 파일)
#   - node_modules는 컨테이너 내부 것 사용 (로컬 환경과 격리)
#
# 🗄️  MySQL 설정:
#   backend/mysql/my.cnf 파일이 자동으로 적용됩니다.
#   - 문자셋: utf8mb4 (한글, 이모지 지원)
#   - Collation: utf8mb4_unicode_ci
#   - 타임존: Asia/Seoul (KST, UTC+9)
#
# 🛑 중지:
#   docker-compose -f docker-compose.dev.yml down
#
# 🗑️  완전 제거 (볼륨 포함):
#   docker-compose -f docker-compose.dev.yml down -v
#
# ⚠️  프로덕션과의 차이점:
#   - 디버거 포트 오픈 (5678)
#   - 소스 코드 실시간 동기화 (볼륨 마운트)
#   - Hot Reload 활성화
#   - 개발용 환경 변수 (PYTHONUNBUFFERED, WATCHFILES_FORCE_POLLING)
#   - Metro 서버 포함 (프로덕션에는 없음)
#
# 📚 관련 문서:
#   - docs/WIFI_DEBUGGING.md: WiFi 디버깅 완전 가이드
#   - docs/DEVELOPMENT.md: 개발 환경 가이드
#   - scripts/README.md: 헬퍼 스크립트 사용법
#
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: fullstack_mysql_dev
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dev_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-appdb}
      MYSQL_USER: ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dev_app_password}
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ./backend/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: fullstack_backend_dev
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "5678:5678"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/requirements.txt:/app/requirements.txt
      - ./backend/.flake8:/app/.flake8
      - /app/app/__pycache__
      - /app/tests/__pycache__
    env_file:
      - ./backend/.env
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - TZ=Asia/Seoul
      - PYTHONUNBUFFERED=1
      - WATCHFILES_FORCE_POLLING=true
    depends_on:
      mysql:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: fullstack_frontend_dev
    restart: unless-stopped
    ports:
      - "8081:8081"
      - "3000:3000"
    volumes:
      - ./frontend/MobileApp:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - REACT_NATIVE_PACKAGER_HOSTNAME=0.0.0.0
      - WATCHMAN_WATCH_DIR=/app
      - TZ=Asia/Seoul
    working_dir: /app
    command: sh -c "npm install && npm run dev"

volumes:
  mysql_dev_data:
  frontend_node_modules:
